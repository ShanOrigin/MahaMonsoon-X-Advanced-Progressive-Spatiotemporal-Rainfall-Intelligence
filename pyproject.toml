[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mahamonsoon-x"
version = "0.1.0"
description = "Advanced Progressive Spatiotemporal Rainfall Intelligence & Benchmarking for Maharashtra"
readme = "README.md"
requires-python = "==3.12.10"
license = { text = "MIT" }
authors = [
    { name = "MahaMonsoon-X Research Team" }
]
keywords = ["monsoon", "rainfall-forecasting", "spatiotemporal", "convlstm", "era5", "climate-intelligence"]
dependencies = [
    "torch>=2.2.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2.0.0",
    "xarray>=2024.1.0",
    "cfgrib>=0.9.15.1",
    "eccodes>=2.34.0",
    "cdsapi>=0.7.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "joblib>=1.3.0",
    "jupyter>=1.0.0",
    "notebook>=7.1.0",
    "nbformat>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "black>=24.2.0"
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["artifacts", "notebooks"]
